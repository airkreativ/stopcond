[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airkreativ-stopcond"
version = "0.1.0"
description = "在边界场景下试探终止判定，标出提前终止与永不终止两种风险"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "airkreativ" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://airkreativ.github.io"
Repository = "https://github.com/airkreativ/stopcond"
Issues = "https://github.com/airkreativ/stopcond/issues"

[project.scripts]
stopcond = "stopcond:main"

[tool.setuptools]
py-modules = ["stopcond"]
